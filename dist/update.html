<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Load latest presentation · Canon</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;background:linear-gradient(135deg,#001139,#123b78);color:#102d4b;font:18px/1.6 Arial,sans-serif}main{width:min(640px,100%);background:#fff;border-radius:22px;padding:48px;box-shadow:0 30px 90px #0003}small{font-size:12px;font-weight:700;letter-spacing:.15em;color:#0756a8}h1{font-size:36px;line-height:1.15;letter-spacing:-1px;margin:20px 0}p{color:#496176}button{font:700 17px Arial,sans-serif;color:white;background:#005dca;border:0;border-radius:9px;padding:17px 25px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}a{color:#005dca}.caption{font-size:14px}#status{min-height:30px;font-size:16px;color:#0756a8;margin:22px 0 0}@media(max-width:600px){main{padding:28px}h1{font-size:29px}}
</style></head><body><main><small>CANON PRODUCTION PRINTING</small><h1>Load the latest presentation</h1><p>Refresh the slides, photos and notes from the server, together with your offline copy.</p><p class="caption">Close the audience window first. Your place in the story and reading preferences are kept. Open the audience again after updating.</p><button id="update">Load latest presentation</button><p id="status" role="status" aria-live="polite"></p><a class="caption" href="presenter.html">Return to presenter</a></main><script>
const button=document.querySelector('#update'),status=document.querySelector('#status');
function activated(reg){return new Promise((resolve,reject)=>{const worker=reg.installing||reg.waiting||reg.active;if(!worker)return reject(Error('No offline copy available.'));if(worker.state==='activated')return resolve(worker);const timer=setTimeout(()=>{worker.removeEventListener('statechange',changed);reject(Error('Update is taking longer than expected. Try again.'));},30000);function changed(){if(worker.state==='activated'){clearTimeout(timer);worker.removeEventListener('statechange',changed);resolve(worker);}else if(worker.state==='redundant'){clearTimeout(timer);worker.removeEventListener('statechange',changed);reject(Error('The update could not finish. Please try again.'));}}worker.addEventListener('statechange',changed);changed();});}
function refresh(worker){return new Promise((resolve,reject)=>{const channel=new MessageChannel(),timer=setTimeout(()=>{channel.port1.close();reject(Error('Could not refresh the offline copy. Please try again.'));},30000);channel.port1.onmessage=e=>{clearTimeout(timer);channel.port1.close();e.data?.ready?resolve():reject(Error('The offline copy could not be refreshed. Please try again.'));};worker.postMessage({type:'REFRESH_CACHE'},[channel.port2]);});}
button.onclick=async()=>{button.disabled=true;status.textContent='Checking the presentation server…';try{const health=await fetch('health',{cache:'no-store'});if(!health.ok||(await health.text()).trim()!=='ok')throw Error('The presentation server is unavailable. Try again when connected.');if('serviceWorker'in navigator&&location.protocol!=='file:'){status.textContent='Downloading the latest presentation…';const reg=await navigator.serviceWorker.register('sw.js',{updateViaCache:'none'});await reg.update();const worker=await activated(reg);await refresh(worker);}status.textContent='Opening the latest presentation…';location.replace(new URL('presenter.html'+location.hash,location.href).href);}catch(e){status.textContent=e.message||'The update could not finish. Please try again.';button.disabled=false;}};
</script></body></html>
