map $uri $canon_cache {
    default "no-cache";
    /sw.js "no-cache, no-store, must-revalidate";
    ~*\.(jpg|png|webp|zip)$ "public, max-age=86400";
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control $canon_cache always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Permissions-Policy "fullscreen=(self), window-management=(self), screen-wake-lock=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; frame-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    location = /health { access_log off; default_type text/plain; return 200 'ok'; }
    location / { try_files $uri $uri/ =404; }
}
